<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070f3"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0d1a2d"/>
      <stop offset="100%" stop-color="#050a15"/>
    </radialGradient>
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="2" stdDeviation="3" flood-color="#0070f3" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#vGrad)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="200" cy="200" r="186" fill="none" stroke="url(#vGrad)" stroke-width="0.5" opacity="0.3"/>
  <path d="M95 255 L135 145 L175 215" stroke="url(#vGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#vShadow)"/>
  <path d="M195 145 L195 255 M195 145 L255 145 M195 200 L245 200" stroke="url(#hGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 270 Q200 120 310 110" stroke="url(#vGrad)" stroke-width="2.5" fill="none" opacity="0.7" filter="url(#glow)"/>
  <path d="M305 108 Q320 100 330 95" stroke="url(#vGrad)" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <text x="200" y="295" text-anchor="middle" fill="white" font-family="system-ui,Inter,sans-serif" font-size="22" font-weight="700" letter-spacing="6">VISION</text>
  <text x="200" y="322" text-anchor="middle" fill="url(#vGrad)" font-family="system-ui,Inter,sans-serif" font-size="22" font-weight="700" letter-spacing="6">HUB</text>
  <line x1="130" y1="338" x2="155" y2="338" stroke="url(#vGrad)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="342" text-anchor="middle" fill="#64748b" font-family="system-ui,Inter,sans-serif" font-size="9" font-weight="500" letter-spacing="3">DIGITAL SOLUTIONS</text>
  <line x1="245" y1="338" x2="270" y2="338" stroke="url(#vGrad)" stroke-width="1" opacity="0.6"/>
  <circle cx="155" cy="360" r="2" fill="url(#vGrad)" opacity="0.6"/>
  <text x="200" y="365" text-anchor="middle" fill="url(#vGrad)" font-family="system-ui,sans-serif" font-size="10" opacity="0.9" direction="rtl">نحو رؤية رقمية .. نصنع الفرق</text>
  <circle cx="245" cy="360" r="2" fill="url(#vGrad)" opacity="0.6"/>
</svg>
